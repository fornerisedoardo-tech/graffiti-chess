*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:flex-start;padding:12px;pointer-events:none}
.brandbtn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brandbtn h1{margin:0}
.chev{font-size:16px;color:var(--muted);transition:transform .2s}
.brandbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);min-width:200px}
.menu[hidden]{display:none}
.menu label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.menu select{width:11.5em;flex:0 0 auto}
#toolbar{position:absolute;left:8px;right:8px;bottom:12px;margin:0 auto;width:max-content;max-width:calc(100% - 16px);display:flex;flex-wrap:wrap;justify-content:center;gap:5px;align-items:center;padding:6px 8px}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h1{font-family:"Permanent Marker",cursive;font-weight:400;font-size:clamp(22px,3.4vw,32px);line-height:1;margin:0 0 4px;color:var(--ink);text-shadow:2px 2px 0 var(--pink),-1px -1px 0 var(--teal)}
#status{font-size:14px;color:var(--muted);min-height:1.2em;margin-top:6px}
#caps{margin-top:4px;font-size:15px;line-height:1.25}
#caps .row{display:flex;align-items:center;gap:6px;min-height:1.25em}
#caps .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;border:1.5px solid #111}
#caps .pcs{letter-spacing:-1px}
#caps .adv{font-size:12px;font-weight:600;color:var(--ink)}
#status b{color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center;max-width:100%}
button,select{font:600 13px Rubik,system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);padding:6px 8px;background:transparent;color:var(--ink);cursor:pointer}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
select{background:var(--panel)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
label.tog{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);cursor:pointer;padding:0 4px}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:none;pointer-events:auto;padding:22px 28px}
#banner .big{font-family:"Permanent Marker",cursive;font-size:clamp(30px,6vw,56px);line-height:1.05;color:var(--yellow);-webkit-text-stroke:2px #111;text-shadow:4px 4px 0 var(--pink);margin-bottom:14px}
label.tilt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);padding:0 4px}
label.tilt input{width:80px;accent-color:var(--pink)}
label.tilt span{font-size:16px}
label.tilt span.tv{font-size:13px;min-width:2.6em;font-variant-numeric:tabular-nums;color:var(--muted)}
#rotateMsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:20;text-align:center;font-size:16px;color:var(--ink)}
#rotateMsg .card{padding:20px 26px}
#rotateMsg .ico{font-size:40px;margin-bottom:8px}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){ #rotateMsg{display:flex} }
#backBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:6;padding:10px 20px;font-size:15px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
body.exploring #toolbar button:not(#exploreBtn):not(#muteBtn), body.exploring #hint{opacity:.35;pointer-events:none}
#promo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;text-align:center;padding:16px 18px;pointer-events:auto}
#promo .ptitle{font-family:"Permanent Marker",cursive;font-size:22px;margin-bottom:10px}
#promo .pgrid{display:grid;grid-template-columns:repeat(4,minmax(64px,96px));gap:8px;margin-bottom:10px}
#promo .pgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;background:var(--panel)}
#promo .pgrid button:hover{border-color:var(--yellow)}
#promo img{width:100%;max-width:80px;aspect-ratio:4/5;object-fit:contain}
#hint{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Permanent Marker",cursive;font-size:28px;color:var(--muted)}
@media (max-width:640px){ #hud{padding:8px} .card{padding:8px 10px} button,select{padding:6px 8px;font-size:12px} #toolbar{bottom:8px} label.tilt input{width:72px} #toolbar .lbl{display:none} #toolbar button{min-width:38px;font-size:15px} #topBtn{font-size:12px!important} }
</style>
</head>
<body>
<div id="app">
  <div id="loading">Shaking the spray cans…</div>
  <div id="hud">
    <div class="card brand">
      <button id="menuBtn" class="brandbtn" aria-expanded="false" aria-controls="menuPanel" title="Menu">
        <h1>Graffiti Chess</h1><span class="chev" aria-hidden="true">▾</span>
      </button>
      <div id="status">Loading…</div>
      <div id="caps" aria-label="Captured pieces"></div>
      <div id="menuPanel" class="menu" hidden>
        <button class="primary" id="newBtn">New game</button>
        <label>Mode<select id="mode">
          <option value="cpu">vs Computer</option>
          <option value="pvp">Two players</option>
        </select></label>
        <label>Your colour<select id="side">
          <option value="w">White</option>
          <option value="b">Black</option>
        </select></label>
        <label>Difficulty<select id="level">
          <option value="1">Easy</option>
          <option value="2" selected>Medium</option>
          <option value="3">Hard</option>
          <option value="4">Expert</option>
        </select></label>
        <label>Board<select id="boardSel">
          <option value="noce">Walnut</option>
          <option value="viola">Purple</option>
          <option value="nero">Black</option>
          <option value="verde">Dark green</option>
          <option value="arancio">Pencil orange</option>
          <option value="blu">Midnight blue</option>
          <option value="mattone">Brick</option>
          <option value="cemento">Concrete</option>
          <option value="avorio">Classic ivory</option>
          <option value="gesso">Asphalt &amp; chalk</option>
          <option value="neon">Neon night</option>
          <option value="metro">Subway tiles</option>
          <option value="torneo">Tournament</option>
          <option value="marmo">Marble</option>
          <option value="acero">Maple &amp; walnut</option>
        </select></label>
        <label>Language<select id="langSel">
          <option value="en">English</option><option value="it">Italiano</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option>
          <option value="pt">Português</option><option value="pl">Polski</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="id">Bahasa Indonesia</option>
        </select></label>
      </div>
    </div>
  </div>
  <div id="toolbar" class="card">
    <button id="undoBtn" title="Undo move" aria-label="Undo move">↶<span class="lbl"> Undo</span></button>
    <button id="flipBtn" title="Rotate view" aria-label="Rotate view">⟲<span class="lbl"> Rotate</span></button>
    <button id="topBtn" aria-pressed="false" title="Top view">Top view</button>
    <button id="exploreBtn" title="360°" aria-label="360°">🔄<span class="lbl"> 360°</span></button>
    <button id="hintBtn" title="Hint" aria-label="Suggest a move">💡<span class="lbl"> Hint</span></button>
    <button id="muteBtn" title="Sound" aria-label="Sound on">🔊</button>
    <label class="tilt" title="View tilt"><span aria-hidden="true">∠</span><input type="range" id="tilt" min="15" max="85" step="1" value="32" aria-label="View tilt"><span id="tiltVal" class="tv">32°</span></label>
  </div>
  <button id="backBtn" class="primary" hidden>▶ <span class="txt">Back to game</span></button>
  <div id="rotateMsg"><div class="card"><div class="ico">📱↻</div><span class="txt">Turn your phone upright to play</span></div></div>
  <div id="banner" class="card"><div class="big" id="bannerText"></div><button class="primary" id="againBtn">Play again</button></div>
  <div id="promo" class="card" role="dialog" aria-label="Choose promotion">
    <div class="ptitle">Promote pawn to</div>
    <div class="pgrid" id="promoGrid"></div>
    <button id="promoCancel">Cancel</button>
  </div>
  <div id="hint">Tap one of your pieces to see where it can go</div>
</div>

let LANG='en'; try{ const l=localStorage.getItem('gc-lang'); if(l&&I18N[l]) LANG=l; }catch(e){}
const L=()=>I18N[LANG];
function applyLang(){
  const t=L(); document.documentElement.lang=LANG;
  const set=(id,txt)=>{ const e=document.getElementById(id); if(e) e.textContent=txt; };
  set('newBtn',t.newGame); document.querySelector('#backBtn .txt').textContent=t.back; set('againBtn',t.again); set('promoCancel',t.cancel);
  document.querySelector('#promo .ptitle').textContent=t.promo;
  set('hint',t.toast); document.querySelector('#rotateMsg .txt').textContent=t.rotateMsg;
  const lab=(sel,txt)=>{ const s=document.getElementById(sel); if(s&&s.parentElement.firstChild) s.parentElement.firstChild.nodeValue=txt; };
  lab('mode',t.mode); lab('side',t.colour); lab('level',t.diff); lab('boardSel',t.board); lab('langSel',t.lang);
  const opt=(sel,map)=>{ const s=document.getElementById(sel); [...s.options].forEach((o,i)=>{ const v=typeof map==='function'?map(o.value,i):map[i]; if(v) o.textContent=v; }); };
  opt('mode',[t.vsCpu,t.twoP]); opt('side',[t.white,t.black]); opt('level',t.lv); opt('boardSel',t.bc);
  document.querySelector('#undoBtn .lbl').textContent=' '+t.undo; document.querySelector('#flipBtn .lbl').textContent=' '+t.rotate; document.querySelector('#hintBtn .lbl').textContent=' '+t.hint;
  for(const [id,txt] of [['undoBtn',t.undo],['flipBtn',t.rotate],['hintBtn',t.hint],['muteBtn',t.sound]]){ const e=document.getElementById(id); e.title=txt; e.setAttribute('aria-label',txt); }
  const tl=document.querySelector('label.tilt'); if(tl){ tl.title=t.tilt; document.getElementById('tilt').setAttribute('aria-label',t.tilt); }
}

{ const ld=document.getElementById('loading'); if(ld) ld.textContent=L().loading; }

try{ await Promise.race([document.fonts.load('60px "Permanent Marker"'), new Promise(r=>setTimeout(r,2500))]); }catch(e){}

/* ---------- palette ---------- */
const PAL={
  w:{body:'#f3ecdc',skin:'#ffe2bd',accent:'#1f63c9',dark:'#16366b',hair:'#f0b43c',beard:'#ece5d3',eye:'#171717',mouth:'#5a2a2a'},
  b:{body:'#4a3b74',skin:'#7a66a3',accent:'#ff3d8b',dark:'#1f1834',hair:'#1f1834',beard:'#2a2140',eye:'#ffffff',mouth:'#140f1f'}
};
const GOLD='#ffc93c', STEEL='#d4dbe3', WOOD='#8a5a32';

/* ---------- renderer / scene ---------- */
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
app.insertBefore(renderer.domElement, app.firstChild);

const scene=new T.Scene();
const camera=new T.PerspectiveCamera(40,1,0.5,700);

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const amb=new T.AmbientLight(0xe6f0ff,.56); scene.add(amb);
const sun=new T.DirectionalLight(0xfff4e0,.7);
sun.position.set(-8,20,12); sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-17,right:17,top:17,bottom:-17,near:1,far:70});
sun.shadow.bias=-0.0008;
scene.add(sun);

/* toon gradient */
const gcv=document.createElement('canvas'); gcv.width=3; gcv.height=1;
{const g=gcv.getContext('2d'); ['#6e6e6e','#b4b4b4','#ffffff'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(i,0,1,1);});}
const GRAD=new T.CanvasTexture(gcv); GRAD.minFilter=GRAD.magFilter=T.NearestFilter; GRAD.generateMipmaps=false;
const matCache={};
const toon=c=>{ if(!matCache[c]){ matCache[c]=new T.MeshToonMaterial({color:c,gradientMap:GRAD}); matCache[c].userData.cached=true; } return matCache[c]; };
const OUT=new T.MeshBasicMaterial({color:0x111111,side:T.BackSide}); OUT.userData.cached=true;

/* ---------- textures ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}

function tagLine(g,text,x,y,size,c1,c2,rot){
  g.save(); g.translate(x,y); g.rotate(rot);
  g.font=`${size}px "Permanent Marker", cursive`; g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round'; g.lineCap='round';
  g.lineWidth=size*.045; g.strokeStyle="rgba(0,0,0,.4)"; g.strokeText(text,3,3);
  const gr=g.createLinearGradient(0,-size/2,0,size/2); gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  g.lineWidth=size*.045; g.strokeStyle=gr; g.strokeText(text,0,0);
  g.restore();
}

function markTex(kind){

/* ---------- animation helpers ---------- */
const ease={lin:t=>t,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,in:t=>t*t*t,out:t=>1-Math.pow(1-t,3)};
function tween(ms,fn){return new Promise(res=>{const s=performance.now(); (function step(){const t=Math.min(1,(performance.now()-s)/ms); fn(t); if(t<1) requestAnimationFrame(step); else res();})();});}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const angleTo=(a,b)=>Math.atan2(b.x-a.x,b.z-a.z);
function turnTo(G,a,ms=170){
  const s=G.rotation.y; const d=((a-s+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
  if(Math.abs(d)<.01) return Promise.resolve();
  return tween(ms,t=>{G.rotation.y=s+d*ease.io(t);});
}
function resetRig(G){const u=G.userData; u.rig.position.set(0,0,0); u.rig.rotation.set(0,0,0); u.rig.scale.setScalar(u.S); u.armW.rotation.set(0,0,0); u.armO.rotation.set(0,0,0); u.hand.rotation.set(0,0,0);
  if('pnk'.includes(u.type)){ u.armW.rotation.x=-.5; u.hand.rotation.x=1.285; }   // weapon held at 45°, pointing up and forward
  if(u.type==='q'){ u.armW.rotation.x=-.5; u.hand.rotation.x=1.024; }            // sceptre held higher, at 60° above the ground
  if(u.type==='b'){ u.hand.rotation.z=-.15; }                                      // banner pole upright, perpendicular to the floor
}
async function walk(G,target){
  const u=G.userData, from=G.position.clone(), d=from.distanceTo(target);
  if(d<.01) return;
  await turnTo(G,angleTo(from,target));
  if(u.type==='n'){
    SFX.play('jump'); const jd=Math.max(480,d*270); SFX.playIn('land',jd);
    await tween(jd,t=>{G.position.lerpVectors(from,target,ease.io(t)); u.rig.position.y=Math.sin(Math.PI*t)*(.45+d*.16); u.rig.rotation.x=Math.sin(Math.PI*2*t)*-.25; u.armW.rotation.x=-.8*Math.sin(Math.PI*t);});
    await tween(150,t=>{const k=Math.sin(Math.PI*t)*.18; u.rig.scale.set(u.S*(1+k*.5),u.S*(1-k),u.S*(1+k*.5));});
  } else if(u.type==='q'){
    SFX.play('glide');
    await tween(Math.max(360,d*320),t=>{ G.position.lerpVectors(from,target,ease.io(t)); const ph=t*Math.PI*2;
      u.rig.rotation.z=Math.sin(ph)*.05; u.rig.position.y=.03*Math.sin(Math.PI*t); u.armO.rotation.x=-.3*Math.sin(Math.PI*t); u.armW.rotation.x=-.4*Math.sin(Math.PI*t); });
  } else {
    const heavy=u.type==='r', steps=Math.max(2,Math.round(d*(heavy?2:2.6))); let stepN=0;
    const dur=Math.max(320,d*(heavy?430:340));
    for(let k=1;k<=steps;k++) SFX.playIn(heavy?'heavyStep':'step',dur*k/steps);   // one footfall at every hop contact
    await tween(dur,t=>{
      G.position.lerpVectors(from,target,t); const ph=t*Math.PI*steps;
      u.rig.position.y=Math.abs(Math.sin(ph))*(heavy?.05:.09);
      u.rig.rotation.z=Math.sin(ph)*(heavy?.12:.06);
      if('pnkq'.includes(u.type)){ u.armW.rotation.x=-.5+Math.sin(ph)*.1; u.hand.rotation.x=u.type==='q'?1.024:1.285; } else if(u.type==='b'){ u.armW.rotation.x=Math.sin(ph)*.12; } else u.armW.rotation.x=Math.sin(ph)*.5;
      u.armO.rotation.x=-Math.sin(ph)*.5;
    });
  }
  resetRig(G);
}
function applyPose(G,p,base,dir){
  const u=G.userData;
  u.armW.rotation.x=p.th||0; u.hand.rotation.x=p.ph||0; u.armO.rotation.x=p.th2||0; u.armW.rotation.z=p.zW||0; u.armO.rotation.z=p.zO||0;
  u.rig.rotation.x=p.lean||0; u.rig.rotation.y=p.twist||0; u.rig.position.y=p.lift||0;
  G.position.copy(base).addScaledVector(dir,p.lunge||0);
}
function lerpPose(a,b,t){const o={}; for(const k of new Set([...Object.keys(a),...Object.keys(b)])) o[k]=(a[k]||0)+((b[k]||0)-(a[k]||0))*t; return o;}
const poseTween=(G,a,b,ms,base,dir,e)=>tween(ms,t=>applyPose(G,lerpPose(a,b,e(t)),base,dir));

    step(){ noise({dur:.05,vol:.16,ft:'bandpass',f:1700,q:1.5}); tone({f:150,f2:85,dur:.06,vol:.16}); },

const particles=[], splats=[]; let shake=0;
const PART_GEO=new T.SphereGeometry(1,6,5), partMats={};
function burst(pos,col,n=12,sp=1){
  const mat=partMats[col]||(partMats[col]=new T.MeshBasicMaterial({color:col}));
  for(let i=0;i<n;i++){
    const m=new T.Mesh(PART_GEO,mat); m.userData.r=rnd(.02,.045); m.scale.setScalar(m.userData.r); m.position.copy(pos); scene.add(m);
    const a=rnd(0,Math.PI*2);

}
function splatAt(pos,col){
  const m=new T.Mesh(new T.PlaneGeometry(.95,.95),new T.MeshBasicMaterial({map:splatTex(col),transparent:true,depthWrite:false}));
  m.rotation.set(-Math.PI/2,0,rnd(0,6.28)); m.position.set(pos.x,.006+Math.random()*.002,pos.z); scene.add(m);

function wordFx(text,pos,c1='#ffd23f',c2='#ff7a1a',scale=1){

function shockwave(pos,col){

async function victimFall(VG,dir,word,silent){
  const u=VG.userData, p0=VG.position.clone(), chest=p0.clone(); chest.y=.5;
  if(u.eyes){ u.eyes.forEach(e=>e.children.forEach(ch=>{ if(!ch.isGroup) ch.visible=false; })); u.xeyes.forEach(x=>x.visible=true); }

  SFX.play('fall'); splatAt(VG.position,PAL[u.color].accent); SFX.play('spray');
  await tween(220,t=>{VG.scale.set(1+.4*t,Math.max(.02,1-.95*t),1+.4*t);});
  scene.remove(VG); disposeTree(VG);
}
async function attack(G,t,VG,vpos,dir){
  const u=G.userData, A=ATK[t], base=G.position.clone(), rest={};
  if(A.seq){
    let prev=rest;
    for(const st of A.seq){ if(st.hit) SFX.playIn(A.word,st.ms); await poseTween(G,prev,st.p,st.ms,base,dir,ease[st.e||'io']); prev=st.p; if(st.hit) break; }
    if(t==='r'){ shockwave(vpos,'#efe6d2'); burst(vpos.clone().setY(.1),'#b9b1a3',22,1.1); }
    else { burst(vpos.clone().setY(.45),GOLD,10,1); }
    const fall=victimFall(VG,dir,A.word,true);
    await wait(240);
    await poseTween(G,prev,rest,t==='n'?380:320,base,dir,ease.out);
    G.position.copy(base); resetRig(G);
    await fall; return;
  }
  if(t==='q'){
    SFX.play('spin');
    await tween(560,e=>{const k=ease.io(e); applyPose(G,lerpPose(rest,A.wind,k),base,dir); u.rig.rotation.y=k*Math.PI*2; u.armO.rotation.z=-.9*Math.sin(Math.PI*e);});
    u.rig.rotation.y=0; u.armO.rotation.z=0;
  } else await poseTween(G,rest,A.wind,300,base,dir,ease.io);
  await wait(90);
  if(t==='b'||t==='k'||t==='q') SFX.play('swish');
  const sms=t==='q'?140:120; SFX.playIn(A.word,sms);
  await poseTween(G,A.wind,A.strike,sms,base,dir,ease.in);
  if(t==='q'){ shockwave(vpos,GOLD); burst(vpos.clone().setY(.35),GOLD,18,1.2); }
  const fall=victimFall(VG,dir,A.word,true);
  await wait(220);
  await poseTween(G,A.strike,rest,280,base,dir,ease.out);
  G.position.copy(base); resetRig(G);
  await fall;
}
async function knightDive(G,VG,vpos,dir,from){
  const u=G.userData, land=vpos.clone().addScaledVector(dir,-.32); land.y=0;
  const d=from.distanceTo(land), h=.95+d*.14, base=new T.Vector3();
  // crouch
  await tween(160,e=>{const k=ease.io(e); applyPose(G,{th:-.6*k,ph:1.3*k,lean:-.25*k},from,dir); u.rig.scale.set(u.S*(1+.08*k),u.S*(1-.14*k),u.S*(1+.08*k));});
  u.rig.scale.setScalar(u.S); SFX.play('jump');
  // single leap straight onto the enemy: lance up on the way up, pointed down on the way down
  const ld=Math.max(620,d*300); SFX.playIn(ATK.n.word,ld);
  await tween(ld,e=>{
    base.lerpVectors(from,land,e);
    const up=Math.min(1,e/.45), dn=Math.max(0,(e-.45)/.55), k=ease.in(dn);
    const pose={th:-.6+(-2.3*ease.out(up))+(2.0*k), ph:1.3+1.2*ease.out(up)+1.04*k, lean:-.25+.15*up+.72*k, lift:Math.sin(Math.PI*e)*h*(1-.25*e)};
    applyPose(G,pose,base,dir);
  });
  const endPose={th:-.9,ph:3.54,lean:.62,lift:0};
  burst(vpos.clone().setY(.45),GOLD,12,1.1);
  const fall=victimFall(VG,dir,ATK.n.word,true);
  await tween(130,e=>{const k=Math.sin(Math.PI*e)*.16; u.rig.scale.set(u.S*(1+k*.5),u.S*(1-k),u.S*(1+k*.5));});
  await wait(160);
  await poseTween(G,endPose,{},300,land,dir,ease.out);
  G.position.copy(land); resetRig(G);
  await fall;
}
async function captureSeq(G,t,VG,vpos,dest){
  const from=G.position.clone(), dir=vpos.clone().sub(from); dir.y=0;
  const dist=dir.length(); dir.normalize();
  const stand=t==='r'?.62:.55;
  const vturn=turnTo(VG,angleTo(vpos,from),260);
  if(t==='n'){ await turnTo(G,angleTo(from,vpos)); await vturn; await knightDive(G,VG,vpos,dir,from); await walk(G,dest); return; }
  if(dist>stand+.05) await walk(G,vpos.clone().addScaledVector(dir,-stand));
  else await turnTo(G,angleTo(from,vpos));
  await vturn;
  await attack(G,t,VG,vpos,dir);
  await walk(G,dest);
}

let marks=[], lastMarks=[];

function showMarks(sq){
  clearMarks();

/* ---------- game flow ---------- */
const mode=()=>$('mode').value;
const colorName=c=>c==='w'?L().white:L().black;
function setStatus(html){$('status').innerHTML=html;}
const GLYPH={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛'}, PV={p:1,n:3,b:3,r:5,q:9};
function updateCaps(){
  const took={w:[],b:[]};
  for(const u of history) if(u.cap) took[u.cap.c==='w'?'b':'w'].push(u.cap.t);
  let mat=0; for(let i=0;i<64;i++){const p=B[i]; if(p&&p.t!=='k') mat+=(p.c==='w'?1:-1)*PV[p.t];}
  const row=c=>{ const list=took[c].sort((a,b)=>PV[a]-PV[b]); const adv=c==='w'?mat:-mat;
    const col=PAL[opp(c)].accent;
    return `<div class="row"><span class="dot" style="background:${PAL[c].accent}"></span><span class="pcs" style="color:${col}">${list.map(t=>GLYPH[t]).join('')}</span>${adv>0?`<span class="adv">+${adv}</span>`:''}</div>`; };
  $('caps').innerHTML=history.some(u=>u.cap)||mat?row('w')+row('b'):'';
}
function updateStatus(){
  updateCaps();
  if(over) return;
  const chk=inCheck(TURN);
  const t=L();
  if(mode()==='cpu') setStatus(TURN===human()?(chk?t.checkYour:t.yourMove(colorName(human()))):t.thinking(colorName(TURN)));
  else setStatus(`${chk?'<b>'+t.check+'</b> ':''}${t.toMove(colorName(TURN))}`);
}
function banner(text){$('bannerText').textContent=text; $('banner').style.display='block';}
function hideBanner(){$('banner').style.display='none';}

const human=()=>$('side').value;
function newGame(animated){
  SFX.cancelPending();
  $('promo').style.display='none'; picking=false;
  gameToken++; busy=false; thinking=false; over=false; selected=null; history=[]; lastMove=null;
  hideBanner(); clearMarks(); showLast();
  splats.forEach(s=>{ scene.remove(s.m); s.m.geometry.dispose(); s.m.material.dispose(); }); splats.length=0;
  resetBoard(); syncVisuals(); legalCache=legalMoves(); clearCelebration(); updateStatus(); saveGame();
  setFlip(mode()==='cpu'&&human()==='b');

}
// new game: "ta-daaa" and the pieces drop back onto their squares, rank by rank
async function dropIn(){
  marching=true; SFX.playIn('tada',0);
  const all=[...meshes.values()];
  all.forEach(G=>{ G.userData.busy=true; G.userData.base=G.position.clone(); G.position.y=2.2; G.scale.setScalar(.01); });
  const order=G=>{ const r=Math.round(3.5-G.userData.base.z); return Math.min(r,7-r); };
  const jobs=all.map(G=>{ const delay=order(G)*120+Math.abs(G.userData.base.x)*25;
    return wait(delay).then(()=>tween(420,t=>{ const e=ease.in(t); G.position.y=2.2*(1-e); G.scale.setScalar(Math.min(1,.2+t*1.4)); }))
      .then(()=>{ G.position.copy(G.userData.base); G.scale.setScalar(1); const u=G.userData;
        return tween(160,t=>{ const k=Math.sin(Math.PI*t)*.16; u.rig.scale.set(u.S*(1+k*.5),u.S*(1-k),u.S*(1+k*.5)); }); })
      .then(()=>{ resetRig(G); G.userData.busy=false; }); });
  [180,420,660].forEach(ms=>SFX.playIn('land',ms+420));
  await Promise.all(jobs);
  marching=false;
}
function saveGame(){
  try{ localStorage.setItem('gc-save',JSON.stringify({v:1,moves:history.map(u=>[u.m.from,u.m.to,u.m.promo||'']),mode:mode(),side:human(),level:$('level').value})); }catch(e){}
}
function restoreGame(){
  let d=null; try{ d=JSON.parse(localStorage.getItem('gc-save')||'null'); }catch(e){}
  if(!d||d.v!==1||!Array.isArray(d.moves)){ newGame(); return; }
  if(d.mode) $('mode').value=d.mode; if(d.side) $('side').value=d.side; if(d.level) $('level').value=d.level;
  $('level').disabled=$('side').disabled=mode()!=='cpu';
  resetBoard(); history=[];
  for(const [f,t,pr] of d.moves){
    const m=legalMoves().find(x=>x.from===f&&x.to===t&&(x.promo||'')===pr); if(!m) break;
    history.push(make(m));
  }
  const lu=history[history.length-1]; lastMove=lu?{from:lu.m.from,to:lu.m.to}:null;
  syncVisuals(); showLast(); legalCache=legalMoves();
  setFlip(mode()==='cpu'&&human()==='b');
  if(!legalCache.length){ over=true; const mate=inCheck(TURN), w=colorName(opp(TURN)); setStatus(mate?L().mateWins(w):'<b>'+L().stale+'</b>'); updateCaps();
    setTimeout(()=>banner(mate?(mode()==='cpu'?(TURN!==human()?L().win:L().lose):L().wins(w)):L().stale),600); return; }
  const dr=drawReason(); if(dr){ over=true; setStatus('<b>'+dr+'</b>'); updateCaps(); setTimeout(()=>banner(dr),600); return; }

let worker=null, workerOK=typeof Worker!=='undefined', reqId=0;
function getWorker(){
  if(!workerOK) return null;
  if(worker) return worker;
  try{
    const src=document.getElementById('engine').textContent;
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  }catch(e){ workerOK=false; worker=null; }
  return worker;
}
function computeMove(level){
  return new Promise(res=>{
    const sync=()=>setTimeout(()=>{const m=bestMove(level); res(m?{from:m.from,to:m.to,promo:m.promo||null}:null);},30);
    const w=getWorker();
    if(!w){ sync(); return; }
    const id=++reqId;
    w.onmessage=e=>{ if(e.data&&e.data.id!==id) return; res(e.data&&e.data.m); };
    w.onerror=ev=>{ if(ev&&ev.preventDefault) ev.preventDefault(); workerOK=false; try{w.terminate();}catch(_){} worker=null; sync(); };
    try{ w.postMessage({id,B,TURN,CR,EP,HSTACK,HALF,level}); }catch(e){ workerOK=false; worker=null; sync(); }
  });
}
async function maybeAI(){
  if(!started||marching||over||mode()!=='cpu'||TURN===human()||thinking) return;
  thinking=true; updateStatus(); const tok=gameToken, atok=aiToken;
  await wait(80);
  const r=await computeMove(+$('level').value);
  if(tok!==gameToken||atok!==aiToken) return;
  thinking=false;
  const m=r&&legalCache.find(x=>x.from===r.from&&x.to===r.to&&(x.promo||null)===(r.promo||null));
  if(m) performMove(m);
}

  return null;
}
function afterMove(){

  if(dr){ over=true; SFX.play('draw'); setStatus('<b>'+dr+'</b>'); setTimeout(()=>banner(dr),500); return; }

    over=true;
    const K=meshes.get(B[kingSq(TURN)].id);
    if(inCheck(TURN)){
      const win=colorName(opp(TURN));
      setStatus(L().mateWins(win));
      const kp=K.position.clone().add(new T.Vector3(0,1.3,0));
      wordFx(L().W.mate,kp,'#ff5a5a','#b3001e',1.3); SFX.play('mate');
      K.userData.busy=true; tween(600,t=>{K.userData.rig.rotation.x=-1.5*ease.out(t);});
      celebrate(opp(TURN));
      setTimeout(()=>banner(mode()==='cpu'?(TURN!==human()?L().win:L().lose):L().wins(win)),3800);
    } else { setStatus('<b>'+L().stale+'</b>'); setTimeout(()=>banner(L().stale),500); }
    return;
  }
  if(inCheck(TURN)){
    const K=meshes.get(B[kingSq(TURN)].id);
    wordFx(L().W.check,K.position.clone().add(new T.Vector3(0,1.3,0)),'#ff5a5a','#b3001e'); SFX.play('check');
    if(!K.userData.busy){K.userData.busy=true; tween(500,t=>{K.userData.rig.rotation.z=Math.sin(t*Math.PI*6)*.15*(1-t);}).then(()=>{K.userData.busy=false; resetRig(K);});}
  }
  updateStatus(); maybeAI();

async function performMove(m){
  const tok=gameToken; busy=true; clearMarks(); selected=null;
  await SFX.ready(); if(tok!==gameToken) return;
  const p=B[m.from], G=meshes.get(p.id), t=G.userData.type;
  let capSq=m.to; if(m.flag==='ep') capSq=m.to+(p.c==='w'?-8:8);
  const vp=B[capSq], VG=vp?meshes.get(vp.id):null;
  let RG=null, rookTo=null;
  if(m.flag==='castle'){const rr=m.from>>3, ks=(m.to&7)===6; RG=meshes.get(B[idx(ks?7:0,rr)].id); rookTo=sqPos(idx(ks?5:3,rr));}
  const u=make(m); history.push(u); lastMove={from:m.from,to:m.to}; showLast();
  [G,VG,RG].forEach(x=>{if(x){x.userData.busy=true; resetRig(x);}});
  const dest=sqPos(m.to);
  if(VG){
    await captureSeq(G,t,VG,sqPos(capSq),dest);
    meshes.delete(vp.id); if(VG.parent){ scene.remove(VG); disposeTree(VG); }
  } else if(RG){
    await Promise.all([walk(G,dest),wait(150).then(()=>walk(RG,rookTo))]);
  } else await walk(G,dest);
  if(tok!==gameToken) return;
  const keep=t==='n';   // only the knight stays facing the direction it came from
  await Promise.all([keep?null:turnTo(G,faceOf(p.c)),RG?turnTo(RG,faceOf(p.c)):null]);
  let finalG=G;
  if(m.promo){
    const NG=makeChar(m.promo,p.c); NG.userData.id=p.id; NG.position.copy(G.position); NG.rotation.y=G.rotation.y;
    scene.remove(G); disposeTree(G); scene.add(NG); meshes.set(p.id,NG); finalG=NG;
    burst(NG.position.clone().setY(.5),PAL[p.c].accent,20); wordFx(L().W[m.promo],NG.position.clone().setY(1.4)); SFX.play('promo');
    await tween(300,t=>NG.scale.setScalar(ease.out(t)));
  }
  [finalG,RG].forEach(x=>{if(x){x.userData.busy=false; resetRig(x);}});
  if(tok!==gameToken) return;
  busy=false; afterMove();
}

const pinch={active:false,d0:0,z0:0,end:0};
renderer.domElement.addEventListener('pointerdown',e=>{ down=($('menuPanel').hidden&&!pinch.active&&performance.now()-pinch.end>250)?{x:e.clientX,y:e.clientY}:null; });

const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
renderer.domElement.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch.active=true; pinch.d0=tdist(e.touches); pinch.z0=zoomT; down=null; } },{passive:true});

  zoomT=Math.min(1,Math.max(0,pinch.z0+(tdist(e.touches)-pinch.d0)/(app.clientWidth*.5))); layoutCamera(); },{passive:true});
renderer.domElement.addEventListener('touchend',e=>{ if(pinch.active&&e.touches.length<2){ pinch.active=false; pinch.end=performance.now(); } },{passive:true});

renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>10){down=null;return;} down=null;
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([...meshes.values()],true);
  if(hits.length){
    let o=hits[0].object; while(o&&o.userData.id===undefined) o=o.parent;
    if(o){const sq=B.findIndex(p=>p&&p.id===o.userData.id); if(sq>=0){onSquare(sq);return;}}
  }
  const h=ray.intersectObject(pickPlane);
  if(h.length){const f=Math.floor(h[0].point.x+4), r2=Math.floor(4-h[0].point.z); if(on(f,r2)) onSquare(idx(f,r2));}
});

/* ---------- camera ---------- */
const Y=new T.Vector3(0,1,0);
const FRONT={target:new T.Vector3(0,.25,.45),off:new T.Vector3(0,6.2,9.9),factor:1};
const TARGET=FRONT.target, OFF=FRONT.off, TILT_MIN=10, TILT_MAX=88, TAG_EDGE=7.25;
let camAngle=0, camFactor=1, topView=false, preTopTilt=null, zoomT=0; const camBase=new T.Vector3(), camTarget=new T.Vector3();
let userTilt=null; try{ const v=parseFloat(localStorage.getItem('gc-tilt')); if(v>=TILT_MIN&&v<=TILT_MAX) userTilt=v; }catch(e){}
$('tilt').max=TILT_MAX; $('tilt').min=TILT_MIN;
const curTilt=portrait=>userTilt!==null?userTilt:(portrait?58:32);
function setTopLabel(){ $('topBtn').setAttribute('aria-pressed',topView); $('topBtn').textContent=topView?L().front:L().top; }
$('tilt').addEventListener('input',()=>{
  userTilt=+$('tilt').value;
  if(zoomT>0&&userTilt<70){ userTilt=70; $('tilt').value=70; }   // while zoomed the tilt stays between 70 and 88
  try{ localStorage.setItem('gc-tilt',userTilt); }catch(e){}
  topView=userTilt>=TILT_MAX; setTopLabel(); layoutCamera();
});
// the top view is simply the end of the tilt range, reached with the same smooth camera move
$('topBtn').onclick=()=>{
  const portrait=camera.aspect<.8, from=curTilt(portrait);
  topView=!topView; setTopLabel();
  const to=topView?TILT_MAX:50;
  const tilt=()=>tween(800,t=>{ userTilt=from+(to-from)*ease.io(t); layoutCamera(); }).then(()=>{ userTilt=to; try{ localStorage.setItem('gc-tilt',to); }catch(e){} layoutCamera(); });
  // going back to the front view: first undo the zoom, then tilt down to 60 degrees
  if(!topView&&zoomT>0){ const z0=zoomT; tween(420,t=>{ zoomT=z0*(1-ease.io(t)); layoutCamera(); }).then(()=>{ zoomT=0; tilt(); }); }
  else tilt();
};
function placeCamera(){
  camTarget.copy(TARGET).applyAxisAngle(Y,camAngle);
  camBase.copy(camTarget).add(OFF.clone().multiplyScalar(camFactor).applyAxisAngle(Y,camAngle));
}
function resize(){
  renderer.setSize(app.clientWidth,app.clientHeight,false); camera.aspect=app.clientWidth/app.clientHeight; layoutCamera();
}
function layoutCamera(){
  const w=app.clientWidth, h=app.clientHeight, portrait=camera.aspect<.8;
  const deg=curTilt(portrait); $('tilt').value=deg; $('tiltVal').textContent=Math.round(deg)+'°';
  if(deg<70) zoomT=0;
  const ang=deg*Math.PI/180, D=(portrait?12.3:11.7)*(1+Math.max(0,deg-32)/56*.3);
  FRONT.off.set(0,D*Math.sin(ang),D*Math.cos(ang));
  FRONT.factor=portrait?Math.max(1,.97/camera.aspect):Math.max(1.05,1.12/camera.aspect);
  const topH=$('menuBtn').offsetHeight+$('status').offsetHeight+34, botH=$('toolbar').offsetHeight+12;
  camera.setViewOffset(w,h,0,-Math.max(-h*.08,Math.min(h*.08,(topH-botH)*.5)),w,h);
  camera.updateProjectionMatrix();
  // keep the board clear of the toolbar and the sides; as the view gets steeper, progressively keep the two table tags in frame too
  const hb=BW/2, k=Math.min(1,Math.max(0,(deg-45)/(TILT_MAX-45))), ws=k*k*(3-2*k), tz=hb+(TAG_EDGE-hb)*ws;
  const lim=-1+2*(botH+10)/h, q=new T.Vector3();
  const pts=[[-hb,-.28,hb],[hb,-.28,hb],[-hb,0,-hb],[hb,0,-hb]].map(a=>new T.Vector3(...a));
  const tagPts=[[-3.3,TY,-tz],[3.3,TY,-tz],[-3.3,TY,tz],[3.3,TY,tz]].map(a=>new T.Vector3(...a));
  const v=FRONT;
  const fits=f=>{ camera.position.copy(v.target).addScaledVector(v.off,f); camera.lookAt(v.target); camera.updateMatrixWorld();
    for(const p of pts){ q.copy(p).project(camera); if(q.y<lim||Math.abs(q.x)>.97) return false; }
    for(const p of tagPts){ q.copy(p).project(camera); if(q.y<lim||q.y>.96||Math.abs(q.x)>.98) return false; }
    return true; };
  if(!fits(v.factor)){
    let lo=v.factor, hi=v.factor*1.25, n=0; while(!fits(hi)&&n++<20){ lo=hi; hi*=1.25; }
    for(let i=0;i<24;i++){ const mid=(lo+hi)/2; if(fits(mid)) hi=mid; else lo=mid; }
    v.factor=hi;
  }
  // pinch zoom (only from 75 degrees up): move the camera in until the board touches the screen edges
  if(deg>=70&&zoomT>0){
    // the maximum zoom is a fixed camera distance: the closest one that still shows all board corners at 75 degrees,
    // so tilting between 75 and 88 while zoomed keeps the same distance and moves smoothly
    const a75=70*Math.PI/180, D75=(portrait?12.3:11.7)*(1+(70-32)/56*.3), off75=new T.Vector3(0,D75*Math.sin(a75),D75*Math.cos(a75));
    const fits75=f=>{ camera.position.copy(v.target).addScaledVector(off75,f); camera.lookAt(v.target); camera.updateMatrixWorld();
      for(const p of [[-hb,0,hb],[hb,0,hb],[-hb,0,-hb],[hb,0,-hb]]){ q.set(...p).project(camera); if(Math.abs(q.x)>.995||Math.abs(q.y)>.995) return false; } return true; };
    let lo=.2, hi=4; for(let i=0;i<26;i++){ const mid=(lo+hi)/2; if(fits75(mid)) hi=mid; else lo=mid; }
    const zf=hi*off75.length()/v.off.length();          // same absolute distance at the current tilt
    if(zf<v.factor) v.factor=v.factor+(zf-v.factor)*zoomT;
  }
  if(portrait){
    camera.position.copy(v.target).addScaledVector(v.off,v.factor); camera.lookAt(v.target); camera.updateMatrixWorld();
    let y0=1,y1=-1; for(const p of [[-hb,-.28,hb],[hb,-.28,hb],[-hb,1,-hb],[hb,1,-hb]]){ q.set(...p).project(camera); y0=Math.min(y0,q.y); y1=Math.max(y1,q.y); }
    const boardMid=(1-(y0+y1)/2)*h/2, areaMid=(topH+(h-botH))/2;
    const cur=camera.view?camera.view.offsetY:0;
    camera.setViewOffset(w,h,0,cur+(boardMid-areaMid),w,h); camera.updateProjectionMatrix();
  }
  camFactor=v.factor; placeCamera();
  if(scene.fog){ const cd=v.off.length()*v.factor; scene.fog.near=cd+20; scene.fog.far=cd+170; }
}

/* ---------- loop ---------- */
const clock=new T.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05), tm=clock.elapsedTime;
  for(const G of meshes.values()){
    const cu=G.userData.capeU;
    if(cu){ const u=G.userData; const pp=G.position; let sp=0;
      if(u.prevPos){ sp=Math.hypot(pp.x-u.prevPos.x,pp.z-u.prevPos.z)/Math.max(dt,1e-3); } else u.prevPos=new T.Vector3();
      u.prevPos.copy(pp);
      const target=Math.min(1,sp*.9+Math.abs(u.rig.position.y)*3);
      u.capeSwing+=(target-u.capeSwing)*Math.min(1,dt*(target>u.capeSwing?8:2.5));
      cu.uSwing.value=u.capeSwing; cu.uTime.value=tm; }
  }
  const nowB=performance.now(); updateBirds(nowB); updateSnails(nowB);
  for(const G of meshes.values()){
    const u=G.userData; if(!u.eyes) continue;
    if(nowB>u.nextBlink){ u.blinkT=nowB; u.nextBlink=nowB+rnd(2200,6500); }
    const bt=(nowB-u.blinkT)/140, sy=bt<1?Math.max(.08,Math.abs(1-2*bt)):1;
    for(const e of u.eyes) e.scale.y=e.scale.x*sy;
  }
  for(const G of meshes.values()){
    const u=G.userData; if(u.busy) continue;
    u.rig.scale.set(u.S,u.S*(1+Math.sin(tm*2.2+u.phase)*.025),u.S);
    u.armO.rotation.x=Math.sin(tm*1.6+u.phase)*.08;
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt; p.v.y-=6*dt; p.m.position.addScaledVector(p.v,dt);
    if(p.m.position.y<.02){p.m.position.y=.02; p.v.multiplyScalar(.4);}
    p.m.scale.setScalar(Math.max(.0004,p.m.userData.r*p.life/p.max));
    if(p.life<=0){scene.remove(p.m); particles.splice(i,1);}
  }
  const now=performance.now();
  for(let i=splats.length-1;i>=0;i--){
    const s=splats[i], age=(now-s.born)/1000;
    if(age>5){s.m.material.opacity=Math.max(0,1-(age-5)); if(age>6){scene.remove(s.m); s.m.geometry.dispose(); s.m.material.dispose(); splats.splice(i,1);}}
  }
  camera.position.copy(camBase);
  camera.lookAt(camTarget);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

})();
